services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeroledger}
      POSTGRES_USER: ${POSTGRES_USER:-aeroledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroledger} -d ${POSTGRES_DB:-aeroledger}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-aeroledger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aeroledger}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      PAYMENT_VERIFICATION_MODE: live
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-60}
      WALLET_ADDRESS_BTC: ${WALLET_ADDRESS_BTC:?WALLET_ADDRESS_BTC is required}
      WALLET_ADDRESS_ETH: ${WALLET_ADDRESS_ETH:?WALLET_ADDRESS_ETH is required}
      WALLET_ADDRESS_SOL: ${WALLET_ADDRESS_SOL:?WALLET_ADDRESS_SOL is required}
      WALLET_ADDRESS_USDT: ${WALLET_ADDRESS_USDT:?WALLET_ADDRESS_USDT is required}
      WALLET_ADDRESS_USDC: ${WALLET_ADDRESS_USDC:?WALLET_ADDRESS_USDC is required}
      WALLET_ADDRESS_BNB: ${WALLET_ADDRESS_BNB:?WALLET_ADDRESS_BNB is required}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:?ETHERSCAN_API_KEY is required}
      BSCSCAN_API_KEY: ${BSCSCAN_API_KEY:?BSCSCAN_API_KEY is required}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:?SOLANA_RPC_URL is required}
      BITCOIN_API_BASE: ${BITCOIN_API_BASE:-https://blockstream.info/api}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["areo_ledger_migrate"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aeroledger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aeroledger}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    env_file: .env.production
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
