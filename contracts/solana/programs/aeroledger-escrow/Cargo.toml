[package]
name = "aeroledger-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aeroledger_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
# `token` + `associated_token` features are required for the SPL token CPI and
# the associated-token-account escrow-vault constraints used in lib.rs. They are
# part of anchor-spl's default feature set, but pinned explicitly here so the
# build does not silently break if defaults change.
anchor-spl = { version = "0.29.0", features = ["token", "associated_token"] }

# Ensure release builds abort on arithmetic overflow instead of silently
# wrapping. Combined with checked_add/checked_sub in the program logic this
# closes the token/lamport math-overflow class of bugs.
[profile.release]
overflow-checks = true
